<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>數獨小屋</title>
<style>
:root{--ink:#243241;--muted:#718093;--paper:#f5f7f4;--card:#fff;--line:#dce3e6;--strong:#647581;--accent:#4b9b84;--accent-soft:#e5f3ed;--wrong:#bd5555;--select:#d8eee6;--peer:#f0f5f2;--given:#263746;--shadow:0 14px 40px #24324112}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 10% 0%,#e8f4ed 0,transparent 38%),var(--paper);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);min-height:100vh}.wrap{max-width:1000px;margin:auto;padding:36px 22px 48px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}.brand{display:flex;align-items:center;gap:12px}.logo{width:44px;height:44px;border-radius:14px;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:22px;font-weight:800;box-shadow:0 6px 15px #4b9b8435}.eyebrow{font-size:11px;letter-spacing:.16em;color:var(--accent);font-weight:800}.brand h1{font-size:20px;margin:2px 0 0}.pill{color:var(--muted);font-size:13px;background:#ffffffaa;border:1px solid var(--line);border-radius:99px;padding:9px 13px}.layout{display:grid;grid-template-columns:minmax(320px,570px) minmax(230px,1fr);gap:28px;align-items:start}.panel{background:var(--card);border:1px solid #e8edeb;border-radius:22px;padding:22px;box-shadow:var(--shadow)}.board{display:grid;grid-template-columns:repeat(9,1fr);aspect-ratio:1;border:2px solid var(--strong);border-radius:8px;overflow:hidden;background:white}.cell{border:0;border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:white;display:grid;place-items:center;position:relative;min-width:0;padding:0;color:#347e6a;font-size:clamp(17px,4vw,27px);font-weight:600;cursor:pointer;outline:none}.cell:nth-child(3n){border-right:2px solid var(--strong)}.cell:nth-child(9n){border-right:0}.cell:nth-child(n+19):nth-child(-n+27),.cell:nth-child(n+46):nth-child(-n+54){border-bottom:2px solid var(--strong)}.cell:nth-child(n+73){border-bottom:0}.cell.given{color:var(--given);font-weight:750;cursor:default}.cell.peer{background:var(--peer)}.cell.same{background:#e6f2ed}.cell.selected{background:var(--select);box-shadow:inset 0 0 0 2px var(--accent);z-index:1}.cell.error{color:var(--wrong);background:#fff0ef}.cell:focus-visible{box-shadow:inset 0 0 0 2px var(--accent);z-index:2}.notes{position:absolute;inset:2px;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);font-size:clamp(7px,1.45vw,11px);line-height:1;color:#718093;font-weight:500;pointer-events:none}.notes span{display:grid;place-items:center}.actions{display:flex;gap:9px;margin-top:16px}.btn{border:1px solid var(--line);background:white;color:var(--ink);padding:10px 14px;border-radius:11px;font:inherit;font-size:13px;font-weight:650;cursor:pointer;transition:.15s}.btn:hover{border-color:#a8c8bc;background:#f8fcfa}.btn.primary{background:var(--accent);border-color:var(--accent);color:white}.btn.primary:hover{background:#3d8873}.btn:focus-visible,.select:focus-visible{outline:3px solid #9fd2bf;outline-offset:2px}.side h2{font-size:16px;margin:0 0 6px}.side p{margin:0;color:var(--muted);font-size:13px;line-height:1.6}.difficulty{margin:20px 0}.label{display:block;font-size:12px;font-weight:750;color:var(--muted);margin-bottom:8px}.select{width:100%;border:1px solid var(--line);padding:11px 12px;border-radius:11px;background:white;color:var(--ink);font:inherit}.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0}.stat{background:#f7f9f7;border-radius:13px;padding:12px}.stat span{display:block;color:var(--muted);font-size:11px}.stat strong{display:block;font-variant-numeric:tabular-nums;font-size:19px;margin-top:3px}.keypad{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin-top:18px}.key{height:42px;border:1px solid var(--line);border-radius:10px;background:white;color:var(--accent);font-weight:750;font-size:16px;cursor:pointer}.key:hover{background:var(--accent-soft);border-color:#a8c8bc}.key.erase{color:var(--muted);font-size:12px;grid-column:span 2}.hint{font-size:12px;color:var(--muted);line-height:1.65;margin-top:15px;padding-top:14px;border-top:1px solid var(--line)}.status{min-height:21px;margin-top:10px;color:var(--accent);font-size:13px;font-weight:650}.status.bad{color:var(--wrong)}.footer{text-align:center;color:#87938f;font-size:11px;margin-top:23px}@media(max-width:740px){.wrap{padding:20px 14px 32px}.layout{grid-template-columns:1fr;gap:14px}.panel{padding:16px}.side{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}.side>h2,.side>p,.difficulty,.stats,.keypad,.hint,.status{grid-column:1/-1}.difficulty{margin:14px 0 0}.stats{margin:12px 0}.keypad{margin-top:8px}.hint{margin-top:10px}.pill{font-size:11px;padding:7px 9px}}@media(max-width:380px){.wrap{padding-inline:9px}.cell{font-size:17px}.panel{padding:11px}.actions .btn{padding:9px 10px}}
</style>
</head>
<body><main class="wrap"><header class="top"><div class="brand"><div class="logo">9</div><div><div class="eyebrow">PAUSE · THINK · SOLVE</div><h1>數獨小屋</h1></div></div><div class="pill">☀️　每天一點專注</div></header>
<div class="layout"><section class="panel" aria-label="數獨棋盤"><div class="board" id="board" role="grid" aria-label="九乘九數獨棋盤"></div><div class="status" id="status" aria-live="polite">選一格，再輸入數字開始吧。</div><div class="actions"><button class="btn primary" id="check">檢查答案</button><button class="btn" id="noteMode" aria-pressed="false">✎ 筆記：關</button><button class="btn" id="hintBtn">給我提示</button><button class="btn" id="newGame">重新開始</button></div></section>
<aside class="panel side"><h2>慢慢解，享受過程</h2><p>每一列、每一行，以及每個 3×3 宮格，都要填入 1 到 9，且不能重複。</p><div class="difficulty"><label class="label" for="level">挑戰難度</label><select class="select" id="level"><option value="easy">輕鬆</option><option value="medium" selected>剛剛好</option><option value="hard">燒腦</option></select></div><div class="stats"><div class="stat"><span>已填格數</span><strong id="filled">0 / 81</strong></div><div class="stat"><span>計時</span><strong id="timer">00:00</strong></div></div><div class="keypad" id="keypad"></div><div class="hint">小提醒：可以用鍵盤的 <b>1–9</b> 輸入，按 <b>Backspace</b> 清除。填錯的數字會以紅色標示。</div></aside></div><div class="footer">給自己一段安靜思考的時間</div></main>
<script>
const puzzles={easy:{p:'530070000600195000098000060800060003400803001700020006060000280000419005000080079',s:'534678912672195348198342567859761423426853791713924856961537284287419635345286179'},medium:{p:'000260701680070090190004500820100040004602900050003028009300074040050036703018000',s:'435269781682571493197834562826195347374682915951743628519326874248957136763418259'},hard:{p:'000000907000420180000705026100904000050000040000507009920108000034059000507000000',s:'462831957795426183381795426173984265659312748248567319926178534834259671517643892'}};
let puzzle=[],solution=[],values=[],notes=[],selected=-1,seconds=0,tick=null,noteMode=false;const board=document.getElementById('board'),status=document.getElementById('status');
function start(){clearInterval(tick);seconds=0;document.getElementById('timer').textContent='00:00';const data=puzzles[document.getElementById('level').value];puzzle=[...data.p].map(Number);solution=[...data.s].map(Number);values=[...puzzle];notes=Array.from({length:81},()=>new Set());selected=-1;noteMode=false;document.getElementById('noteMode').textContent='✎ 筆記：關';document.getElementById('noteMode').setAttribute('aria-pressed','false');status.textContent='選一格，再輸入數字開始吧。';status.className='status';draw();tick=setInterval(()=>{seconds++;document.getElementById('timer').textContent=String(Math.floor(seconds/60)).padStart(2,'0')+':'+String(seconds%60).padStart(2,'0')},1000)}
function draw(){board.innerHTML='';for(let i=0;i<81;i++){const b=document.createElement('button');b.className='cell'+(puzzle[i]?' given':'');b.setAttribute('role','gridcell');b.setAttribute('aria-label',`第${Math.floor(i/9)+1}行第${i%9+1}列${values[i]?'，'+values[i]:''}${puzzle[i]?'，題目數字':''}`);if(values[i])b.textContent=values[i];else if(notes[i].size){const ns=document.createElement('span');ns.className='notes';for(let k=1;k<=9;k++){const x=document.createElement('span');x.textContent=notes[i].has(k)?k:'';ns.appendChild(x)}b.appendChild(ns)}b.dataset.i=i;b.onclick=()=>{selected=i;draw()};if(selected>=0){const sr=Math.floor(selected/9),sc=selected%9,r=Math.floor(i/9),c=i%9;if(i===selected)b.classList.add('selected');else if(r===sr||c===sc||Math.floor(r/3)===Math.floor(sr/3)&&Math.floor(c/3)===Math.floor(sc/3))b.classList.add('peer');if(values[i]&&values[i]===values[selected])b.classList.add('same')}if(values[i]&&!puzzle[i]&&hasConflict(i))b.classList.add('error');board.appendChild(b)}document.getElementById('filled').textContent=values.filter(Boolean).length+' / 81'}
function hasConflict(i){const v=values[i],r=Math.floor(i/9),c=i%9;for(let j=0;j<81;j++)if(j!==i&&values[j]===v&&(Math.floor(j/9)===r||j%9===c||Math.floor(Math.floor(j/9)/3)===Math.floor(r/3)&&Math.floor((j%9)/3)===Math.floor(c/3)))return true;return false}
function enter(n){if(selected<0||puzzle[selected])return;if(noteMode&&n){if(values[selected])return;notes[selected].has(n)?notes[selected].delete(n):notes[selected].add(n);draw();return}values[selected]=n;notes[selected].clear();draw();if(values.every((v,i)=>v===solution[i])){status.textContent='太棒了！你完成了這盤數獨 🎉';status.className='status';clearInterval(tick)}}
for(let n=1;n<=9;n++){const b=document.createElement('button');b.className='key';b.textContent=n;b.onclick=()=>enter(n);document.getElementById('keypad').appendChild(b)}const erase=document.createElement('button');erase.className='key erase';erase.textContent='⌫ 清除';erase.onclick=()=>enter(0);document.getElementById('keypad').appendChild(erase);
document.addEventListener('keydown',e=>{if(e.key>='1'&&e.key<='9')enter(Number(e.key));if(e.key==='Backspace'||e.key==='Delete')enter(0);if(e.key.startsWith('Arrow')&&selected>=0){e.preventDefault();const d={ArrowUp:-9,ArrowDown:9,ArrowLeft:-1,ArrowRight:1}[e.key],next=selected+d;if(next>=0&&next<81&&!(Math.abs(d)===1&&Math.floor(next/9)!==Math.floor(selected/9))){selected=next;draw();board.children[next].focus()}}});
document.getElementById('noteMode').onclick=()=>{noteMode=!noteMode;const b=document.getElementById('noteMode');b.textContent=noteMode?'✎ 筆記：開':'✎ 筆記：關';b.setAttribute('aria-pressed',String(noteMode));status.textContent=noteMode?'筆記模式已開啟，輸入數字來記下候選答案。':'筆記模式已關閉。';status.className='status'};document.getElementById('newGame').onclick=start;document.getElementById('level').onchange=start;document.getElementById('check').onclick=()=>{if(values.every((v,i)=>v===solution[i])){status.textContent='完全正確！恭喜完成 🎉';status.className='status';clearInterval(tick)}else{const wrong=values.filter((v,i)=>v&&v!==solution[i]).length;status.textContent=wrong?`找到 ${wrong} 個不正確的數字，再試試看。`:'目前沒有填錯，繼續加油！';status.className=wrong?'status bad':'status'}};document.getElementById('hintBtn').onclick=()=>{if(selected<0){status.textContent='先選擇一個空格，我再給你提示。';return}if(puzzle[selected]){status.textContent='這是題目給定的數字，選一個空格試試。';return}if(noteMode){noteMode=false;const b=document.getElementById('noteMode');b.textContent='✎ 筆記：關';b.setAttribute('aria-pressed','false')}enter(solution[selected]);status.textContent='提示已填入一格，繼續加油！';status.className='status'};start();
</script></body></html>
